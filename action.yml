name: 'npm bump'
description: 'npm version {major,minor,patch} && npm publish as an action with other fun doodads.'
branding:
  icon: box
  color: blue
inputs:
  git-email:
    description: 'Email for the version commit. Defaults to <actor>@users.noreply.github.com.'
    required: false
  git-username:
    description: 'Name for the version commit. Defaults to github.actor.'
    required: false
  version-type:
    description: 'Version type dropdown value (major, minor, patch, custom). If provided, takes precedence over new-version unless custom.'
    required: false
  new-version:
    description: 'Version bump type or explicit version (e.g. major, minor, patch, 1.2.3). Required when version-type is "custom" or version-type is not set.'
    required: false
  push-version-commit:
    description: 'Run git push --follow-tags after npm version. Enable if you do not push in a prepublishOnly hook.'
    required: false
    default: false
  publish-cmd:
    description: 'Command to run after npm version. Override to skip npm publish or use a custom release script.'
    required: false
    default: 'npm publish'
  github-token:
    description: 'Pass secrets.GITHUB_TOKEN to enable GitHub release creation via releasearoni.'
    required: false
outputs:
  release-tag:
    description: "The created git tag as described by git describe --tags"
    value: ${{ steps.release-tag-retreiver.outputs.release-tag }}
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Configure git author
      shell: bash
      env:
        GIT_USERNAME: ${{ inputs['git-username'] || github.actor }}
        GIT_EMAIL: ${{ inputs['git-email'] || format('{0}@users.noreply.github.com', github.actor) }}
      run: |
        git config --global user.name "$GIT_USERNAME"
        git config --global user.email "$GIT_EMAIL"
    - name: git status
      shell: bash
      run: git status --short --branch
    - name: Resolve release version
      id: resolve-version
      shell: bash
      env:
        VERSION_TYPE: ${{ inputs['version-type'] }}
        NEW_VERSION: ${{ inputs['new-version'] }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION_TYPE" ]; then
          if [ "$VERSION_TYPE" = "custom" ]; then
            if [ -z "$NEW_VERSION" ]; then
              echo "new-version is required when version-type is custom" >&2
              exit 1
            fi
            safe_new_version=$(printf '%s' "$NEW_VERSION" | tr -d '\n\r')
            echo "new-version=$safe_new_version" >> "$GITHUB_OUTPUT"
          else
            safe_version_type=$(printf '%s' "$VERSION_TYPE" | tr -d '\n\r')
            echo "new-version=$safe_version_type" >> "$GITHUB_OUTPUT"
          fi
        else
          if [ -z "$NEW_VERSION" ]; then
            echo "Either version-type or new-version must be provided" >&2
            exit 1
          fi
          safe_new_version=$(printf '%s' "$NEW_VERSION" | tr -d '\n\r')
          echo "new-version=$safe_new_version" >> "$GITHUB_OUTPUT"
        fi
    - name: npm version
      shell: bash
      env:
        NEW_VERSION: ${{ steps['resolve-version'].outputs['new-version'] }}
        GITHUB_TOKEN: ${{ inputs['github-token'] }}
      run: npm version "$NEW_VERSION"
    - run: echo "release-tag=$(git describe --tags)" >> $GITHUB_OUTPUT
      id: release-tag-retreiver
      shell: bash
    - name: git push
      shell: bash
      env:
        PUSH_VERSION_COMMIT: ${{ inputs['push-version-commit'] }}
      run: |
        if [ "$PUSH_VERSION_COMMIT" = "true" ]; then
          git push --follow-tags
        else
          echo "Skipping git push --follow-tags"
        fi
    - name: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs['github-token'] }}
        PUBLISH_CMD: ${{ inputs['publish-cmd'] }}
      run: |
        set -euo pipefail
        # Split PUBLISH_CMD into an array by whitespace (no shell metacharacter interpretation)
        # shellcheck disable=SC2086
        read -ra cmd_args <<< "$PUBLISH_CMD"
        "${cmd_args[@]}"
