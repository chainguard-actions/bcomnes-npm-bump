name: Test error when version-type is custom but new-version is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Ensure HEAD is on a branch
        run: |
          BRANCH=$(git branch --show-current)
          echo "Current branch: $BRANCH"
          if [ -z "$BRANCH" ]; then
            git checkout -b test-branch
          fi

      - name: Clean up existing tags to avoid conflicts
        run: |
          git tag -l | xargs -r git tag -d || true

      - name: Set up npm package
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          printf '{\n  "name": "test-package",\n  "version": "1.0.0",\n  "description": "test"\n}\n' > package.json
          git add package.json
          git commit -m "chore: add package.json for test"

      - id: action
        uses: .
        with:
          version-type: custom
          git-email: test@example.com
          git-username: Test User
          publish-cmd: echo "skipping publish"
        continue-on-error: true

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when version-type=custom and new-version is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed"
