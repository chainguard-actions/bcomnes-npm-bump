name: Test error when version-type=custom but new-version is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - id: action
        uses: .
        continue-on-error: true
        with:
          git-email: "test@example.com"
          git-username: "Test User"
          version-type: "custom"
          publish-cmd: "echo skip"

      - name: Assert action failed when custom version-type has no new-version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when version-type=custom and new-version is not set, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when version-type=custom without new-version"
