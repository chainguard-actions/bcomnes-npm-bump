name: Test error when neither version-type nor new-version is provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - id: action
        uses: .
        continue-on-error: true
        with:
          git-email: "test@example.com"
          git-username: "Test User"
          publish-cmd: "echo skip"

      - name: Assert action failed when no version inputs provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither version-type nor new-version is set, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no version inputs provided"
